[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-documents"
version = "1.0.0"
description = "Unified MCP Server for Document Processing - Word, PDF, PowerPoint, and Format Conversion"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "MCP Documents Team"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "python-docx>=1.1.2",
    "lxml>=4.9.0",
    "Pillow>=10.0.0",
    "pypandoc>=1.14",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
pdf = [
    "pdf2docx>=0.5.0",
]
full = [
    "pdf2docx>=0.5.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
]

[project.urls]
"Homepage" = "https://github.com/mcp-documents/mcp-documents"

[tool.hatch.build.targets.wheel]
packages = ["mcp_documents"]

[project.scripts]
mcp-documents = "mcp_documents.server:main"
