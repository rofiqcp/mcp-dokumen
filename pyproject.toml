[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcpdocx-unified"
version = "1.0.0"
description = "MCP DOCX Unified Server - 90 Tools for Reading, Generating, and Editing Word Documents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "MCP DOCX Team"}
]
keywords = [
    "mcp",
    "docx",
    "word",
    "document",
    "model-context-protocol",
    "ai",
    "llm"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: General",
    "Topic :: Office/Business :: Office Suites",
]
dependencies = [
    "mcp>=1.0.0",
    "python-docx>=1.1.0",
    "lxml>=4.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
mcpdocx = "mcpdocx.server:main"

[project.urls]
Homepage = "https://github.com/mcpdocx/mcpdocx-unified"
Documentation = "https://github.com/mcpdocx/mcpdocx-unified#readme"
Repository = "https://github.com/mcpdocx/mcpdocx-unified.git"
Issues = "https://github.com/mcpdocx/mcpdocx-unified/issues"

[tool.hatch.build.targets.wheel]
packages = ["mcpdocx"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
